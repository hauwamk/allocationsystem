{% extends "base.html" %}

{% block title %}Add Exam | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Schedule Examination</h2>
        <p>Set exam date, start time, and duration for a course.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'exam_list' %}" class="btn btn-secondary">&larr; Back to Exams</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Exam Schedule</button>
            <a href="{% url 'exam_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
