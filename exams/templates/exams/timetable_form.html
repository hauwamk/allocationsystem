{% extends "base.html" %}

{% block title %}Create Timetable Batch | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Create Timetable Batch</h2>
        <p>Define a named examination period (e.g., "2026 First Semester Examination").</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'timetable_list' %}" class="btn btn-secondary">&larr; Back to Timetables</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Draft Batch</button>
            <a href="{% url 'timetable_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
