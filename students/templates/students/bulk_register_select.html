{% extends "base.html" %}

{% block title %}Bulk Register{% endblock %}

{% block content %}
<h2>Bulk Register Students for Courses</h2>
<p>Pick a department, level, and semester. You'll get a list of matching students and matching core courses to review before registering everyone at once.</p>

<form method="get">
    <p>
        <label>Department</label><br>
        <select name="department" required>
            <option value="">-- Select --</option>
            {% for value, label in departments %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </p>
    <p>
        <label>Level</label><br>
        <select name="level" required>
            <option value="">-- Select --</option>
            {% for value, label in levels %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </p>
    <p>
        <label>Semester</label><br>
        <select name="semester" required>
            <option value="">-- Select --</option>
            {% for value, label in semesters %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </p>
    <button type="submit" class="btn">Next: Review Matches</button>
</form>
{% endblock %}
