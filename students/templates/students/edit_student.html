{% extends "base.html" %}

{% block title %}Edit Student | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Edit Student Details</h2>
        <p>Update student profile information. Credentials will stay in sync.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'students_list' %}" class="btn btn-secondary">&larr; Back to Students</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'students_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
