{% extends "base.html" %}

{% block title %}Add Student | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Add New Student</h2>
        <p>Register a student record. Login credentials will be provisioned automatically.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'students_list' %}" class="btn btn-secondary">&larr; Back to Students</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Student Record</button>
            <a href="{% url 'students_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
