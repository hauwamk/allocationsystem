{% extends "base.html" %}

{% block title %}Reset Officer Password | Superadmin Console{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Reset Officer Password</h2>
        <p>Set a new password for <strong>{{ officer.username }}</strong>.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'exam_officer_list' %}" class="btn btn-secondary">&larr; Back to Exam Officers</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Reset Password</button>
            <a href="{% url 'exam_officer_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
