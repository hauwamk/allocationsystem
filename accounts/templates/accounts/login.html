{% extends "base.html" %}

{% block title %}Student Login{% endblock %}

{% block content %}
<h2>Student Login</h2>
<p>Log in with your registration number and password.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Log in</button>
</form>
{% endblock %}
