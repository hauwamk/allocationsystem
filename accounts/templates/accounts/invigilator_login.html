{% extends "base.html" %}

{% block title %}Invigilator Login | Examination System{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="form-card" style="width: 100%; max-width: 440px; margin: 0;">
        <h2 style="margin-top: 0; font-size: 1.4rem;">Invigilator Login</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Sign in with your Staff ID and account password to access supervision schedules.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.7rem;">Sign In to Invigilator Desk</button>
        </form>
    </div>
</div>
{% endblock %}
