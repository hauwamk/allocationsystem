{% extends "base.html" %}

{% block title %}Departments{% endblock %}

{% block content %}
<h2>Departments</h2>

<table border="1">
    <tr><th>Code</th><th>Name</th><th>Students</th><th>Courses</th><th>Action</th></tr>
    {% for dept in departments %}
    <tr>
        <td>{{ dept.code }}</td>
        <td>{{ dept.name }}</td>
        <td>{{ dept.student_count }}</td>
        <td>{{ dept.course_count }}</td>
        <td><a href="{% url 'department_detail' dept.code %}">View</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
