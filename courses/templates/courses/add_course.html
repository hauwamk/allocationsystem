{% extends "base.html" %}

{% block title %}Add Course | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Add New Course</h2>
        <p>Register a course into the faculty academic curriculum.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'course_list' %}" class="btn btn-secondary">&larr; Back to Courses</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Course</button>
            <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
