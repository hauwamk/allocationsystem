{% extends "base.html" %}

{% block title %}
Delete Course
{% endblock %}

{% block content %}

<h2>Delete Course</h2>

<p>
    Are you sure you want to delete
    <strong>{{ course.course_code }} - {{ course.course_title }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'course_list' %}">Cancel</a>

{% endblock %}
