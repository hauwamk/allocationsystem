{% extends "base.html" %}

{% block title %}Add Invigilator | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Add New Invigilator</h2>
        <p>Register a supervisor. An account will be automatically created with their Staff ID.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'invigilators_list' %}" class="btn btn-secondary">&larr; Back to Invigilators</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Invigilator</button>
            <a href="{% url 'invigilators_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
