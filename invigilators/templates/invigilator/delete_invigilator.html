{% extends "base.html" %}

{% block title %}
Delete Invigilator
{% endblock %}

{% block content %}

<h2>Delete Invigilator</h2>

<p>
    Are you sure you want to delete
    <strong>{{ invigilator.full_name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'invigilators_list' %}">Cancel</a>

{% endblock %}
