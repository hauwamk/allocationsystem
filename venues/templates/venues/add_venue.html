{% extends "base.html" %}

{% block title %}Add Venue | Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Add Examination Venue</h2>
        <p>Register a new exam hall and its verified seating capacity.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'venue_list' %}" class="btn btn-secondary">&larr; Back to Venues</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Venue</button>
            <a href="{% url 'venue_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
